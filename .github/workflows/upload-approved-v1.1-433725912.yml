name: Upload approved YRT Music v1.1 assets
on:
  push:
    branches: [main]
    paths: ['.github/workflows/upload-approved-v1.1-433725912.yml']
permissions:
  contents: write
concurrency:
  group: yrtmusic-approved-v1.1-433725912
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 'yrt-coder/YRTMusic'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Upload only the three verified and approved release attachments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, hashlib, urllib.request, urllib.error
          REPO = 'yrt-coder/YRTMusic'
          RELEASE_ID = 433725912
          PUBLISHED_AT = '2026-11-04T09:15:12Z'
          SOURCE_COMMIT = '3eca0110b6c6df4f9a444869ac66f02ff67efd72'
          STAGING_COMMIT = '4024d336a78c1f860c9f3cdc1113884a07172fbc'
          ASSETS = [{'name': 'YRTMusic-Setup-v1.1-x64.exe', 'bytes': 3723024, 'sha256': 'f598bab986470a4fd8e81f4defada0d8961aa8fb8415337f435a643403f3f5ec', 'blob_sha': '25372760fc1d177ec7933c3605fd1250262e8fd6'}, {'name': 'SHA256SUMS.txt', 'bytes': 178, 'sha256': 'ed7c4629ab5150e588056be89e59573f496fbb53c6e3d6199022a824acd070b9', 'blob_sha': '4387255e040375b9d98f0e537109a8517ccf31df'}, {'name': 'YRTMusic-v1.1.zip', 'bytes': 1480997, 'sha256': '6ab06a08d7325ffcf96e6dca24cd569c7b1da72e53e2fe7df6eb7cc7559e9bc1', 'blob_sha': 'e108b6bb6b604637af149f24f68f2baf9aceae14'}]
          EXPECTED_BODY = base64.b64decode('').decode("utf-8")
          TOKEN = os.environ['GH_TOKEN']
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          API = 'https://api.github.com/repos/' + REPO
          def api(method, path, value=None):
              data = None if value is None else json.dumps(value).encode('utf-8')
              headers = {'Authorization': 'Bearer '+TOKEN, 'Accept': 'application/vnd.github+json', 'User-Agent': 'YRTMusic-approved-v1.1-publication'}
              if data is not None: headers['Content-Type'] = 'application/json'
              request = urllib.request.Request(API+'/'+path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=90) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None
          release = api('GET', 'releases/'+str(RELEASE_ID))
          assert release['id']==RELEASE_ID and release['tag_name']=='v1.1'
          assert release['published_at']==PUBLISHED_AT and not release['draft'] and not release['prerelease']
          assert not release.get('immutable', False)
          assert release['body'].replace(chr(13),'').strip()==EXPECTED_BODY.replace(chr(13),'').strip()
          tag = api('GET', 'git/ref/tags/v1.1')
          assert tag['object']['type']=='commit' and tag['object']['sha']==SOURCE_COMMIT
          old = api('GET', 'releases/tags/v1.0')
          assert old['id']==429735560 and old['published_at']=='2026-10-31T05:09:48Z'
          for item in ASSETS:
              current = api('GET','releases/'+str(RELEASE_ID))
              existing = next((a for a in current['assets'] if a['name']==item['name']), None)
              if existing:
                  assert existing['state']=='uploaded' and existing['size']==item['bytes']
                  assert existing.get('digest')=='sha256:'+item['sha256']
                  print('Already verified:',item['name'],item['sha256'])
                  continue
              blob = api('GET','git/blobs/'+item['blob_sha'])
              assert blob['encoding']=='base64' and blob['size']==item['bytes']
              data = base64.b64decode(blob['content'])
              assert len(data)==item['bytes'] and hashlib.sha256(data).hexdigest()==item['sha256']
              url = 'https://uploads.github.com/repos/'+REPO+'/releases/'+str(RELEASE_ID)+'/assets?name='+item['name']
              request = urllib.request.Request(url,data=data,headers={'Authorization':'Bearer '+TOKEN,'Content-Type':'application/octet-stream','User-Agent':'YRTMusic-approved-v1.1-publication'},method='POST')
              with urllib.request.urlopen(request,timeout=120) as response: uploaded=json.load(response)
              assert uploaded['name']==item['name'] and uploaded['size']==item['bytes'] and uploaded['state']=='uploaded'
              if uploaded.get('digest'): assert uploaded['digest']=='sha256:'+item['sha256']
              print('Uploaded verified asset:',item['name'],item['sha256'])
          final = api('GET','releases/'+str(RELEASE_ID))
          assert final['published_at']==PUBLISHED_AT and final['tag_name']=='v1.1'
          assert {a['name'] for a in final['assets']}=={a['name'] for a in ASSETS}
          try:
              staging = api('GET','git/ref/tags/v1.1-publication-staging')
          except urllib.error.HTTPError as error:
              if error.code!=404: raise
          else:
              assert staging['object']['type']=='commit' and staging['object']['sha']==STAGING_COMMIT
              api('DELETE','git/refs/tags/v1.1-publication-staging')
              print('Removed only the temporary publication staging tag.')
          assert api('GET','releases/tags/v1.0')['published_at']=='2026-10-31T05:09:48Z'
          print('Approved release finalized:',final['html_url'],PUBLISHED_AT)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as report:
              report.write('Verified v1.1 attachments uploaded to the existing release.'+chr(10)*2)
              report.write(final['html_url']+chr(10)*2+'Publication time preserved: '+PUBLISHED_AT+chr(10))
              for item in ASSETS: report.write(chr(10)+'- '+item['name']+': `'+item['sha256']+'`')
          PY
